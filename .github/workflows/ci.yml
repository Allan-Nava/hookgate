name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `node >=18`, no dependencies. Run the check on the floor and on every later line
  # without `npm install`, so both claims are tested rather than stated.
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # A handler with no key must fall through — exit 0, empty stdout — once per harness
      # environment: Claude Code (CLAUDE_PLUGIN_ROOT) and Codex CLI (PLUGIN_ROOT).
      - run: |
          for h in CLAUDE_PLUGIN_ROOT PLUGIN_ROOT; do
            out="$(echo '{"hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"rm -rf /"},"cwd":"/tmp"}' | env -u TYPESAFE_API_KEY $h=/plugin node bin/hookgate.mjs pre-tool-use)"
            test -z "$out" || { echo "$h: expected fall-through, got $out"; exit 1; }
          done

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # What `npm publish` would actually ship.
      - run: npm pack --dry-run

  # BACKLOG.md is the single source of truth; ROADMAP.md is generated from it and the
  # issues are synced from it.
  backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # backlogsync, pinned to its release: a malformed item or a stale roadmap fails
      # here; the planner's own tests live in backlogsync (HG-33).
      - uses: Allan-Nava/backlogsync@backlogsync--v0.1.1
        with:
          command: check
